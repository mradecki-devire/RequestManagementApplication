spring.application.name=request_management

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ustawienia Hibernate dla H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Aktywowanie inicjalizacji skryptami SQL
spring.sql.init.mode=always

# W??cza konsol? H2 w przegl?darce
spring.h2.console.enabled=true

# Zezwolenie na wy?wietlanie konsoli w ramkach (wymagane w nowym Spring Security)
spring.h2.console.settings.web-allow-others=false